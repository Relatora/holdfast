# Launcher icons, generated from the PNGs that tool/render_icons_test.dart
# renders from lib/brand/holdfast_mark.dart. Regenerate after changing the
# mark:
#   flutter test tool/render_icons_test.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  # Android 8+: the slate contours behind, the cage and beacon in front, and
  # a flat version for Android 13's themed icons.
  adaptive_icon_background: assets/brand/icon_background.png
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/icon.png
    background_color: "#0F1417"
    theme_color: "#0F1417"
  windows:
    generate: true
    image_path: assets/brand/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/brand/icon.png
